name: An idea
description: Something Locust could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like Locust to do, and what you are trying to get done with it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another app, a workaround, or not at all.
